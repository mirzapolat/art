server {
  listen 3000;
  root /usr/share/nginx/html;

  # Behind Traefik: redirects (e.g. /de -> /de/) must stay relative, or nginx
  # would send visitors to its internal port.
  absolute_redirect off;

  # Pages are exported as folders (/de/index.html), so no SPA fallback:
  # unknown paths get the site's own 404 page.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets never change: cache them for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
